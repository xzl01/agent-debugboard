# SPDX-License-Identifier: Apache-2.0

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y

CONFIG_SAMPLE_USBD_PID=0x0204
CONFIG_SAMPLE_USBD_PRODUCT="Pico2 2xUART+SWD test"
CONFIG_SAMPLE_USBD_MANUFACTURER="Radxa"
CONFIG_SAMPLE_USBD_SELF_POWERED=n
CONFIG_SAMPLE_USBD_MAX_POWER=100

CONFIG_DAP=y
CONFIG_DAP_BACKEND_USB=y
CONFIG_DAP_LOG_LEVEL_INF=y
CONFIG_DP_DRIVER_LOG_LEVEL_INF=y

CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_UART_BRIDGE=y
CONFIG_UART_BRIDGE_BUF_SIZE=256

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2

# No UART console on purpose: the two hardware UARTs are exclusively
# owned by the CDC ACM bridges. Logs are only for a debug build with an
# external console attached.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
