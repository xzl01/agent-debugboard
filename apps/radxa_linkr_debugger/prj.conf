CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_SENSOR=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y
CONFIG_I2C=y
CONFIG_SPI=n
CONFIG_DMA=y
CONFIG_DMA_RPI_PICO=y
CONFIG_DYNAMIC_INTERRUPTS=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_NCM_CLASS=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_HWINFO=y
CONFIG_HWINFO_RPI_PICO_CHIP_ID=y
CONFIG_WATCHDOG=y
CONFIG_REBOOT=y

CONFIG_NETWORKING=y
CONFIG_NET_LOG=y
CONFIG_NET_L2_ETHERNET=y
# Apply the persisted per-board MAC before the NCM interface starts.
CONFIG_ETH_NET_IF_NO_AUTO_START=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_DHCPV4_SERVER_ICMP_PROBE_TIMEOUT=0
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=2
CONFIG_NET_TCP_TIME_WAIT_DELAY=0
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=1
# Keep USB NCM local-only. The debugger is not an Internet gateway or DNS
# server, so advertising either option can steal the host's default route.
CONFIG_NET_DHCPV4_SERVER_OPTION_ROUTER=n
CONFIG_NET_DHCPV4_SERVER_OPTION_DNS_ADDRESS=""
CONFIG_NET_DHCPV4_SERVER_OPTION_CAPTIVE_PORTAL=y
# Empty override makes the DHCP server advertise its own dynamic address.
# /generate_204 is served with the capport JSON, so the auto URI is functional.
CONFIG_NET_DHCPV4_SERVER_OPTION_CAPTIVE_PORTAL_URI=""
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_BUF_POOL_USAGE=y
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_MAX_CONN=16
CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_TC_THREAD_PREEMPTIVE=y

CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_VERSION_1=y
CONFIG_HTTP_SERVER_VERSION_2=n
# Keep four REST/control slots available when all four live WebSocket slots
# are occupied. Otherwise browser keep-alive connections can exhaust the HTTP
# client table and surface as an empty 502 through the host proxy.
CONFIG_HTTP_SERVER_MAX_CLIENTS=8
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=512
CONFIG_HTTP_SERVER_MAX_URL_LENGTH=128
CONFIG_HTTP_SERVER_MAX_HEADER_LEN=128
CONFIG_HTTP_SERVER_WEBSOCKET=y
CONFIG_WEBSOCKET_MAX_CONTEXTS=4
CONFIG_RPI_PICO_TEMP=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_THREAD_RUNTIME_STATS=y

CONFIG_JSON_LIBRARY=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_SERIAL=y
CONFIG_ZVFS_OPEN_MAX=32
CONFIG_ZVFS_EVENTFD_MAX=8
CONFIG_ZVFS_POLL_MAX=16
CONFIG_NET_LOOPBACK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_USBD_CDC_ACM_WORKQUEUE=n
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# Generic Zephyr mutation shells bypass the firmware's allowlists, confirmation
# gates, reboot semantics, and cross-domain hardware policy. Keep control on
# project-owned shell commands and HTTP/WS/host CLI paths.
CONFIG_I2C_SHELL=n
CONFIG_GPIO_SHELL=n
CONFIG_DEVMEM_SHELL=n
CONFIG_DEVICE_SHELL=n
CONFIG_KERNEL_SHELL=n
CONFIG_SHELL_PROMPT_UART="linkr-debugger:~$ "

# Keep generic module logging at warning level to fit the 8 KiB flash reserve;
# Linkr modules set CONFIG_LINKR_DEBUGGER_LOG_LEVEL explicitly.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_LINKR_DEBUGGER_LOG_LEVEL=2
CONFIG_BOOT_BANNER=n
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_STACK_SENTINEL=y
CONFIG_MEM_SLAB_TRACE_MAX_UTILIZATION=y
CONFIG_HEAP_MEM_POOL_SIZE=49152
