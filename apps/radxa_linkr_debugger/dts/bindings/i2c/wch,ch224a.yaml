description: WCH CH224A USB PD sink controller

compatible: "wch,ch224a"

include: [i2c-device.yaml]

properties:
  maximum-request-millivolt:
    type: int
    default: 28000
    description: |
      Maximum voltage that firmware may request from the source. This is a
      board-level power-path limit and may be lower than the CH224A capability.

  input-voltage-sensor:
    type: phandle
    required: true
    description: |
      Voltage-divider sensor measuring the CH224A input source on the board.
      The driver samples this sensor before every CH224A I2C transaction.

  input-present-threshold-millivolt:
    type: int
    required: true
    description: |
      Source-side voltage at or above which consecutive samples may establish
      that the CH224A input is present.

  input-absent-threshold-millivolt:
    type: int
    required: true
    description: |
      Source-side voltage below which input presence is cleared immediately.

  input-present-stable-samples:
    type: int
    required: true
    description: |
      Consecutive samples required to establish presence from an absent or
      unknown state.

  input-sample-interval-ms:
    type: int
    required: true
    description: Delay between consecutive samples used to establish presence.

  cfg1-gpios:
    type: phandle-array
    description: |
      Optional MCU GPIO connected to CFG1 through a series resistor. The
      driver configures this GPIO as a high-impedance input without pulls so the external
      CFG1-to-GND Rset remains authoritative. I2C mode is selected by that
      external single-resistor configuration; firmware must not drive CFG1.
