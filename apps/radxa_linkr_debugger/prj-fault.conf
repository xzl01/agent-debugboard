# HIL-only overlay. Normal production builds keep fault injection disabled.
CONFIG_LINKR_DEBUGGER_FAULT_INJECTION=y
# Ensure the HIL payload has a distinct MCUboot version so MCUboot performs
# the test swap even when the production image also advertises 0.0.0+0.
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="0.0.1+0"
