name: Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decoder:
    name: Build and test Rust logic decoder (WASM)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/decoder

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked

      - name: Check formatting
        run: cargo fmt --manifest-path web/decoder/Cargo.toml --all --check

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Run clippy
        run: cargo clippy --manifest-path web/decoder/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path web/decoder/Cargo.toml --all-targets

      - name: Build WASM (fmt/clippy/test must pass first)
        run: |
          cargo build --manifest-path web/decoder/Cargo.toml --release --target wasm32-unknown-unknown --features wasm
          wasm-bindgen web/decoder/target/wasm32-unknown-unknown/release/radxa_logic_decoder.wasm \
            --target web \
            --out-dir /tmp/decoder-out \
            --out-name logic-decoder \
            --no-typescript
          test -f /tmp/decoder-out/logic-decoder.js
          test -f /tmp/decoder-out/logic-decoder_bg.wasm

  web:
    name: Build Web frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend tests
        working-directory: web
        run: npm test

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Test frontend
        working-directory: web
        run: npm test

  scripts:
    name: Check install and helper scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check shell scripts
        run: |
          shellcheck skills/radxa-linkr-debugger/scripts/install.sh apps/radxa_linkr_debugger/tests/run_unit_tests.sh skills/radxa-linkr-debugger/scripts/web-ota-hil.sh
          sh -n skills/radxa-linkr-debugger/scripts/install.sh
          sh -n apps/radxa_linkr_debugger/tests/run_unit_tests.sh
          sh -n skills/radxa-linkr-debugger/scripts/web-ota-hil.sh

      - name: Run firmware model unit tests
        run: ./apps/radxa_linkr_debugger/tests/run_unit_tests.sh

  windows-installer:
    name: Check Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v6

      - name: Check PowerShell installer
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content .\skills\radxa-linkr-debugger\scripts\install.ps1 -Raw))
          .\skills\radxa-linkr-debugger\scripts\install.ps1 -DryRun

  firmware:
    name: Build RP2350 UF2 firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v6
        with:
          path: app

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Set up Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          toolchains: arm-zephyr-eabi
          sdk-version: "1.0.1"

      - name: Install MCUboot image tool dependencies
        run: python3 -m pip install -r bootloader/mcuboot/scripts/requirements.txt

      - name: Build RP2350 firmware
        run: |
          mkdir -p dist/firmware
          west build -p always -b rpi_pico2/rp2350a/m33/mcuboot --sysbuild app/apps/radxa_linkr_debugger -d build/radxa_linkr_debugger
          python3 "$ZEPHYR_BASE/scripts/build/mergehex.py" \
            -o build/radxa_linkr_debugger/radxa-linkr-debugger-rp2350-combined.hex \
            build/radxa_linkr_debugger/mcuboot/zephyr/zephyr.hex \
            build/radxa_linkr_debugger/radxa_linkr_debugger/zephyr/zephyr.signed.hex
          python3 "$ZEPHYR_BASE/scripts/build/uf2conv.py" \
            -c -f 0xe48bff57 \
            -o dist/firmware/radxa-linkr-debugger-rp2350.uf2 \
            build/radxa_linkr_debugger/radxa-linkr-debugger-rp2350-combined.hex
          cp build/radxa_linkr_debugger/radxa_linkr_debugger/zephyr/zephyr.signed.bin dist/firmware/radxa-linkr-debugger-rp2350-ota.bin
          cp build/radxa_linkr_debugger/radxa_linkr_debugger/zephyr/zephyr.elf dist/firmware/radxa-linkr-debugger-rp2350.elf
          cp build/radxa_linkr_debugger/radxa_linkr_debugger/zephyr/zephyr.map dist/firmware/radxa-linkr-debugger-rp2350.map

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v6
        with:
          name: radxa-linkr-debugger-firmware
          path: dist/firmware/
          if-no-files-found: error

  host-cli:
    name: Test advanced/Agent Rust host CLI
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_id: Linux-amd64
            artifact_name: radxa-linkr-debuggerctl-rust_linux_amd64.tar.gz
            binary_path: cmd-ng/target/x86_64-unknown-linux-musl/release/radxa-linkr-debuggerctl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact_id: Linux-arm64
            artifact_name: radxa-linkr-debuggerctl-rust_linux_arm64.tar.gz
            binary_path: cmd-ng/target/aarch64-unknown-linux-musl/release/radxa-linkr-debuggerctl
          - os: macos-latest
            target: ""
            artifact_id: macOS-arm64
            artifact_name: radxa-linkr-debuggerctl-rust_darwin_arm64.tar.gz
            binary_path: cmd-ng/target/release/radxa-linkr-debuggerctl
          - os: windows-latest
            target: ""
            artifact_id: Windows-amd64
            artifact_name: radxa-linkr-debuggerctl-rust_windows_amd64.zip
            binary_path: cmd-ng/target/release/radxa-linkr-debuggerctl.exe

    steps:
      - name: Checkout application
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python for Linux cross compilation
        if: runner.os == 'Linux'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cmd-ng

      - name: Install Linux cross-compile tools
        if: runner.os == 'Linux'
        run: |
          rustup target add "${{ matrix.target }}"
          python3 -m pip install cargo-zigbuild==0.23.0 ziglang==0.16.0

      - name: Install ARM64 emulator
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Check formatting
        run: cargo fmt --manifest-path cmd-ng/Cargo.toml --all --check

      - name: Run clippy
        run: cargo clippy --manifest-path cmd-ng/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path cmd-ng/Cargo.toml --all-targets

      - name: Smoke test Rust host CLI build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cargo zigbuild --locked --release --manifest-path cmd-ng/Cargo.toml --target "${{ matrix.target }}"
            file "${{ matrix.binary_path }}"
            if readelf -l "${{ matrix.binary_path }}" | grep -q "Requesting program interpreter"; then
              echo "Linux release binary must not use a dynamic interpreter" >&2
              exit 1
            fi
            if readelf -d "${{ matrix.binary_path }}" | grep -q '(NEEDED)'; then
              echo "Linux release binary must not have dynamic library dependencies" >&2
              exit 1
            fi
            if strings "${{ matrix.binary_path }}" | grep -Eq 'GLIBC_[0-9]'; then
              echo "Linux release binary must not require glibc symbols" >&2
              exit 1
            fi
          else
            cargo build --locked --release --manifest-path cmd-ng/Cargo.toml
          fi
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            qemu-aarch64-static "${{ matrix.binary_path }}" --help
            qemu-aarch64-static "${{ matrix.binary_path }}" --version
          else
            "${{ matrix.binary_path }}" --help
            "${{ matrix.binary_path }}" --version
          fi

      - name: Package Rust host CLI artifact
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/rust-cli
          tar -C "$(dirname "${{ matrix.binary_path }}")" \
            -czf dist/rust-cli/${{ matrix.artifact_name }} \
            "$(basename "${{ matrix.binary_path }}")"

      - name: Package Rust host CLI artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/rust-cli | Out-Null
          Compress-Archive -Path "${{ matrix.binary_path }}" -DestinationPath dist/rust-cli/${{ matrix.artifact_name }}

      - name: Upload Rust host CLI artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rust-host-cli-${{ matrix.artifact_id }}
          path: dist/rust-cli/${{ matrix.artifact_name }}
          if-no-files-found: error

  skill-bundle:
    name: Upload skill bundle artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v6

      - name: Package skill bundle
        run: |
          mkdir -p dist/skills
          tar -C skills -czf dist/skills/skills-radxa-linkr-debugger.tar.gz radxa-linkr-debugger

      - name: Upload skill bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: skills-radxa-linkr-debugger
          path: dist/skills/skills-radxa-linkr-debugger.tar.gz
          if-no-files-found: error
