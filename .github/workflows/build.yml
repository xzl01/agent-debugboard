name: Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable commit SHA to validate
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  source:
    name: Validate immutable source
    runs-on: ubuntu-latest
    outputs:
      effective_source_sha: ${{ steps.effective_source.outputs.effective_source_sha }}

    steps:
      - name: Validate requested source SHA
        id: effective_source
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          INHERITED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_SOURCE_SHA" && ! "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be exactly 40 lowercase hexadecimal characters" >&2
            exit 1
          fi
          effective_source_sha="${REQUESTED_SOURCE_SHA:-$INHERITED_SOURCE_SHA}"
          if [[ ! "$effective_source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "effective source SHA must be exactly 40 lowercase hexadecimal characters" >&2
            exit 1
          fi
          printf 'effective_source_sha=%s\n' "$effective_source_sha" >> "$GITHUB_OUTPUT"

  version-gate:
    name: Check synchronized project version
    needs: source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.source.outputs.effective_source_sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Test version tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Check synchronized versions
        run: python3 scripts/version_sync.py check

  decoder:
    name: Build and test Rust logic decoder (WASM)
    needs:
      - source
      - version-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.source.outputs.effective_source_sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: web/decoder

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked

      - name: Check formatting
        run: cargo fmt --manifest-path web/decoder/Cargo.toml --all --check

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Run clippy
        run: cargo clippy --manifest-path web/decoder/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path web/decoder/Cargo.toml --all-targets

      - name: Build WASM (fmt/clippy/test must pass first)
        run: |
          cargo build --manifest-path web/decoder/Cargo.toml --release --target wasm32-unknown-unknown --features wasm
          wasm-bindgen web/decoder/target/wasm32-unknown-unknown/release/radxa_logic_decoder.wasm \
            --target web \
            --out-dir /tmp/decoder-out \
            --out-name logic-decoder \
            --no-typescript
          test -f /tmp/decoder-out/logic-decoder.js
          test -f /tmp/decoder-out/logic-decoder_bg.wasm

  nix:
    name: Check Nix flake
    needs: source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.source.outputs.effective_source_sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Check Nix flake
        run: nix flake check -L

  web:
    name: Build Web frontend
    needs:
      - source
      - version-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.source.outputs.effective_source_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend tests
        working-directory: web
        run: npm test

      - name: Build frontend
        working-directory: web
        run: npm run build

  host-tools:
    name: Test Rust Host Tools, Serial Broker and MCP
    needs:
      - source
      - version-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.source.outputs.effective_source_sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Install serial and tray dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: host-tools

      - name: Check formatting
        run: cargo fmt --manifest-path host-tools/Cargo.toml --all --check

      - name: Run clippy
        run: cargo clippy --manifest-path host-tools/Cargo.toml --all-targets -- -D warnings

      - name: Run Host, Broker and MCP tests
        run: cargo test --locked --manifest-path host-tools/Cargo.toml --all-targets

      - name: Smoke test Host CLI surface
        run: |
          cargo build --locked --manifest-path host-tools/Cargo.toml
          host-tools/target/debug/linkr-host --help
          host-tools/target/debug/linkr-host mcp --help
          host-tools/target/debug/linkr-tray --help

  desktop-release:
    name: Preflight unified desktop release archive
    needs:
      - source
      - version-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: radxa-linkr-desktop_linux_amd64.tar.gz
          - os: macos-latest
            asset_name: radxa-linkr-desktop_darwin_arm64.tar.gz
          - os: windows-latest
            asset_name: radxa-linkr-desktop_windows_amd64.zip

    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.source.outputs.effective_source_sha }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            host-tools
            cmd-ng

      - name: Build Web, Host, tray and CLI
        shell: bash
        run: |
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          npm --prefix web ci
          npm --prefix web run build
          cargo build --locked --release --manifest-path host-tools/Cargo.toml
          cargo build --locked --release --manifest-path cmd-ng/Cargo.toml
          "host-tools/target/release/linkr-host$suffix" --version
          "host-tools/target/release/linkr-tray$suffix" --version
          "cmd-ng/target/release/radxa-linkr-debuggerctl$suffix" --version

      - name: Assemble desktop bundle
        shell: bash
        run: |
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          root="desktop-release/radxa-linkr-desktop"
          mkdir -p "$root/bin" "$root/share/radxa-linkr-debugger/web"
          cp "host-tools/target/release/linkr-host$suffix" "$root/bin/"
          cp "host-tools/target/release/linkr-tray$suffix" "$root/bin/"
          cp "cmd-ng/target/release/radxa-linkr-debuggerctl$suffix" "$root/bin/"
          cp -R web/dist/. "$root/share/radxa-linkr-debugger/web/"
          cp scripts/install-host.sh "$root/install.sh"
          cp scripts/install-host.ps1 "$root/install.ps1"

      - name: Verify bundled installer
        if: runner.os != 'Windows'
        run: |
          sh -n desktop-release/radxa-linkr-desktop/install.sh
          desktop-release/radxa-linkr-desktop/install.sh --dry-run --no-start --no-autostart

      - name: Verify bundled installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = '.\desktop-release\radxa-linkr-desktop\install.ps1'
          $null = [scriptblock]::Create((Get-Content $installer -Raw))
          & $installer -DryRun -NoStart -NoAutostart

      - name: Package desktop archive
        if: runner.os != 'Windows'
        run: tar -C desktop-release -czf desktop-release/${{ matrix.asset_name }} radxa-linkr-desktop

      - name: Package desktop archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path desktop-release\radxa-linkr-desktop -DestinationPath desktop-release\${{ matrix.asset_name }}

      - name: Verify desktop archive exists
        shell: bash
        run: test -s "desktop-release/${{ matrix.asset_name }}"

  scripts:
    name: Check install and helper scripts
    needs:
      - source
      - version-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.source.outputs.effective_source_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev shellcheck

      - name: Check shell scripts
        run: |
          shellcheck skills/radxa-linkr-debugger/scripts/install.sh scripts/install-host.sh apps/radxa_linkr_debugger/tests/run_unit_tests.sh skills/radxa-linkr-debugger/scripts/web-ota-hil.sh skills/radxa-linkr-debugger/scripts/config-persistence-hil.sh skills/radxa-linkr-debugger/scripts/config-persistence-hil.test.sh
          sh -n skills/radxa-linkr-debugger/scripts/install.sh
          sh -n scripts/install-host.sh
          scripts/install-host.sh --dry-run
          sh -n apps/radxa_linkr_debugger/tests/run_unit_tests.sh
          sh -n skills/radxa-linkr-debugger/scripts/web-ota-hil.sh
          sh -n skills/radxa-linkr-debugger/scripts/config-persistence-hil.sh
          sh -n skills/radxa-linkr-debugger/scripts/config-persistence-hil.test.sh

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Check CI contracts and test registration
        run: |
          node --test scripts/check-nightly-workflow.test.mjs scripts/check-rdb-alias.test.mjs scripts/check-repository-gates.test.mjs scripts/check-test-registration.test.mjs scripts/check-doc-layout.test.mjs scripts/check-skill-boundary.test.mjs
          node scripts/check-nightly-workflow.mjs --root .
          node scripts/check-rdb-alias.mjs --root .
          node scripts/check-repository-gates.mjs --root .
          node scripts/check-test-registration.mjs --root .
          node scripts/check-doc-layout.mjs --root .
          node scripts/check-skill-boundary.mjs --root .

      - name: Check persistent-configuration documentation
        run: |
          node --test scripts/check-persistent-configuration-docs.test.mjs
          node scripts/check-persistent-configuration-docs.mjs --root .

      - name: Run persistent-configuration HIL fixture tests
        run: sh skills/radxa-linkr-debugger/scripts/config-persistence-hil.test.sh

      - name: Run firmware model unit tests
        run: ./apps/radxa_linkr_debugger/tests/run_unit_tests.sh

  windows-installer:
    name: Check Windows installer
    needs:
      - source
      - version-gate
    runs-on: windows-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.source.outputs.effective_source_sha }}

      - name: Check PowerShell installer
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content .\skills\radxa-linkr-debugger\scripts\install.ps1 -Raw))
          .\skills\radxa-linkr-debugger\scripts\install.ps1 -DryRun
          $null = [scriptblock]::Create((Get-Content .\scripts\install-host.ps1 -Raw))
          .\scripts\install-host.ps1 -DryRun

  firmware:
    name: Build RP2350 UF2 firmware
    needs:
      - source
      - version-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.source.outputs.effective_source_sha }}
          path: app

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Set up Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a # v1
        with:
          app-path: app
          toolchains: arm-zephyr-eabi
          sdk-version: "1.0.1"

      - name: Install MCUboot image tool dependencies
        run: python3 -m pip install -r bootloader/mcuboot/scripts/requirements.txt

      - name: Build RP2350 firmware
        run: |
          mkdir -p dist/firmware
          west build -p always -b rpi_pico2/rp2350a/m33/mcuboot --sysbuild app/apps/radxa_linkr_debugger -d build/radxa_linkr_debugger
          cp build/radxa_linkr_debugger/radxa-linkr-debugger-rp2350.uf2 dist/firmware/radxa-linkr-debugger-rp2350.uf2
          cp build/radxa_linkr_debugger/radxa_linkr_debugger/zephyr/zephyr.signed.bin dist/firmware/radxa-linkr-debugger-rp2350-ota.bin
          cp build/radxa_linkr_debugger/radxa_linkr_debugger/zephyr/zephyr.elf dist/firmware/radxa-linkr-debugger-rp2350.elf
          cp build/radxa_linkr_debugger/radxa_linkr_debugger/zephyr/zephyr.map dist/firmware/radxa-linkr-debugger-rp2350.map

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: radxa-linkr-debugger-firmware
          path: dist/firmware/
          if-no-files-found: error

  host-cli:
    name: Test advanced/Agent Rust host CLI
    needs:
      - source
      - version-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_id: Linux-amd64
            artifact_name: radxa-linkr-debuggerctl-rust_linux_amd64.tar.gz
            binary_path: cmd-ng/target/x86_64-unknown-linux-musl/release/radxa-linkr-debuggerctl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact_id: Linux-arm64
            artifact_name: radxa-linkr-debuggerctl-rust_linux_arm64.tar.gz
            binary_path: cmd-ng/target/aarch64-unknown-linux-musl/release/radxa-linkr-debuggerctl
          - os: macos-latest
            target: ""
            artifact_id: macOS-arm64
            artifact_name: radxa-linkr-debuggerctl-rust_darwin_arm64.tar.gz
            binary_path: cmd-ng/target/release/radxa-linkr-debuggerctl
          - os: windows-latest
            target: ""
            artifact_id: Windows-amd64
            artifact_name: radxa-linkr-debuggerctl-rust_windows_amd64.zip
            binary_path: cmd-ng/target/release/radxa-linkr-debuggerctl.exe

    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.source.outputs.effective_source_sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Set up Python for Linux cross compilation
        if: runner.os == 'Linux'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cmd-ng

      - name: Install Linux cross-compile tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
          rustup target add "${{ matrix.target }}"
          python3 -m pip install cargo-zigbuild==0.23.0 ziglang==0.16.0

      - name: Install ARM64 emulator
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Check formatting
        run: cargo fmt --manifest-path cmd-ng/Cargo.toml --all --check

      - name: Run clippy
        run: cargo clippy --manifest-path cmd-ng/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path cmd-ng/Cargo.toml --all-targets

      - name: Smoke test Rust host CLI build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cargo zigbuild --locked --release --manifest-path cmd-ng/Cargo.toml --target "${{ matrix.target }}"
            file "${{ matrix.binary_path }}"
            if readelf -l "${{ matrix.binary_path }}" | grep -q "Requesting program interpreter"; then
              echo "Linux release binary must not use a dynamic interpreter" >&2
              exit 1
            fi
            if readelf -d "${{ matrix.binary_path }}" | grep -q '(NEEDED)'; then
              echo "Linux release binary must not have dynamic library dependencies" >&2
              exit 1
            fi
            if strings "${{ matrix.binary_path }}" | grep -Eq 'GLIBC_[0-9]'; then
              echo "Linux release binary must not require glibc symbols" >&2
              exit 1
            fi
          else
            cargo build --locked --release --manifest-path cmd-ng/Cargo.toml
          fi
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            qemu-aarch64-static "${{ matrix.binary_path }}" --help
            qemu-aarch64-static "${{ matrix.binary_path }}" --version
          else
            "${{ matrix.binary_path }}" --help
            "${{ matrix.binary_path }}" --version
          fi

      - name: Package Rust host CLI artifact
        if: runner.os != 'Windows'
        run: |
          stage_dir=dist/rust-cli/stage
          mkdir -p "$stage_dir"
          cp "${{ matrix.binary_path }}" "$stage_dir/radxa-linkr-debuggerctl"
          ln -s radxa-linkr-debuggerctl "$stage_dir/rdb"
          test "$(readlink "$stage_dir/rdb")" = radxa-linkr-debuggerctl
          tar -C "$stage_dir" \
            -czf dist/rust-cli/${{ matrix.artifact_name }} \
            radxa-linkr-debuggerctl rdb

      - name: Package Rust host CLI artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stageDir = "dist/rust-cli/stage"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item -Path "${{ matrix.binary_path }}" -Destination (Join-Path $stageDir "radxa-linkr-debuggerctl.exe")
          New-Item -ItemType HardLink -Path (Join-Path $stageDir "rdb.exe") -Target (Join-Path $stageDir "radxa-linkr-debuggerctl.exe") | Out-Null
          $primaryHash = (Get-FileHash -Algorithm SHA256 (Join-Path $stageDir "radxa-linkr-debuggerctl.exe")).Hash
          $aliasHash = (Get-FileHash -Algorithm SHA256 (Join-Path $stageDir "rdb.exe")).Hash
          if ($primaryHash -ne $aliasHash) { throw "rdb.exe must match radxa-linkr-debuggerctl.exe" }
          Compress-Archive -Path (Join-Path $stageDir "radxa-linkr-debuggerctl.exe"), (Join-Path $stageDir "rdb.exe") -DestinationPath dist/rust-cli/${{ matrix.artifact_name }}

      - name: Upload Rust host CLI artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: rust-host-cli-${{ matrix.artifact_id }}
          path: dist/rust-cli/${{ matrix.artifact_name }}
          if-no-files-found: error

  skill-bundle:
    name: Upload skill bundle artifact
    needs:
      - source
      - version-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.source.outputs.effective_source_sha }}

      - name: Package skill bundle
        run: |
          mkdir -p dist/skills
          tar -C skills -czf dist/skills/skills-radxa-linkr-debugger.tar.gz radxa-linkr-debugger

      - name: Upload skill bundle artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: skills-radxa-linkr-debugger
          path: dist/skills/skills-radxa-linkr-debugger.tar.gz
          if-no-files-found: error

  gate:
    name: Required repository gate
    if: ${{ always() }}
    needs:
      - source
      - version-gate
      - decoder
      - nix
      - web
      - host-tools
      - desktop-release
      - scripts
      - windows-installer
      - firmware
      - host-cli
      - skill-bundle
    runs-on: ubuntu-latest

    steps:
      - name: Require every validation job to pass
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$REQUIRED_RESULTS"
