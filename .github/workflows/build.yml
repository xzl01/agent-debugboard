name: Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Build Web frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

  scripts:
    name: Check install and helper scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check shell scripts
        run: |
          shellcheck skills/radxa-linkr-debugger/scripts/install.sh apps/radxa_linkr_debugger/tests/run_unit_tests.sh
          sh -n skills/radxa-linkr-debugger/scripts/install.sh
          sh -n apps/radxa_linkr_debugger/tests/run_unit_tests.sh

      - name: Run firmware model unit tests
        run: ./apps/radxa_linkr_debugger/tests/run_unit_tests.sh

  windows-installer:
    name: Check Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v6

      - name: Check PowerShell installer
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content .\skills\radxa-linkr-debugger\scripts\install.ps1 -Raw))
          .\skills\radxa-linkr-debugger\scripts\install.ps1 -DryRun

  firmware:
    name: Build RP2040 and RP2350 UF2 firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v6
        with:
          path: app

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Set up Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          toolchains: arm-zephyr-eabi
          sdk-version: "1.0.1"

      - name: Build RP2040 firmware
        run: |
          west build -p always -b rpi_pico/rp2040 app/apps/radxa_linkr_debugger -d build/radxa_linkr_debugger
          mkdir -p dist/firmware
          cp build/radxa_linkr_debugger/zephyr/zephyr.uf2 dist/firmware/radxa-linkr-debugger-rp2040.uf2
          cp build/radxa_linkr_debugger/zephyr/zephyr.elf dist/firmware/radxa-linkr-debugger-rp2040.elf
          cp build/radxa_linkr_debugger/zephyr/zephyr.map dist/firmware/radxa-linkr-debugger-rp2040.map

      - name: Build RP2350 firmware
        run: |
          west build -p always -b rpi_pico2/rp2350a/m33 app/apps/radxa_linkr_debugger -d build/radxa_linkr_debugger
          cp build/radxa_linkr_debugger/zephyr/zephyr.uf2 dist/firmware/radxa-linkr-debugger-rp2350.uf2
          cp build/radxa_linkr_debugger/zephyr/zephyr.elf dist/firmware/radxa-linkr-debugger-rp2350.elf
          cp build/radxa_linkr_debugger/zephyr/zephyr.map dist/firmware/radxa-linkr-debugger-rp2350.map

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v6
        with:
          name: radxa-linkr-debugger-firmware
          path: dist/firmware/
          if-no-files-found: error

  host-cli:
    name: Test advanced/Agent Rust host CLI
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: radxa-linkr-debuggerctl-rust_linux_amd64.tar.gz
          - os: macos-latest
            artifact_name: radxa-linkr-debuggerctl-rust_darwin_arm64.tar.gz
          - os: windows-latest
            artifact_name: radxa-linkr-debuggerctl-rust_windows_amd64.zip

    steps:
      - name: Checkout application
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cmd-ng

      - name: Check formatting
        run: cargo fmt --manifest-path cmd-ng/Cargo.toml --all --check

      - name: Run clippy
        run: cargo clippy --manifest-path cmd-ng/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path cmd-ng/Cargo.toml --all-targets

      - name: Smoke test Rust host CLI build
        shell: bash
        run: |
          cargo build --release --manifest-path cmd-ng/Cargo.toml
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./cmd-ng/target/release/radxa-linkr-debuggerctl.exe --help
            ./cmd-ng/target/release/radxa-linkr-debuggerctl.exe --version
          else
            ./cmd-ng/target/release/radxa-linkr-debuggerctl --help
            ./cmd-ng/target/release/radxa-linkr-debuggerctl --version
          fi

      - name: Package Rust host CLI artifact
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/rust-cli
          tar -C cmd-ng/target/release -czf dist/rust-cli/${{ matrix.artifact_name }} radxa-linkr-debuggerctl

      - name: Package Rust host CLI artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/rust-cli | Out-Null
          Compress-Archive -Path cmd-ng/target/release/radxa-linkr-debuggerctl.exe -DestinationPath dist/rust-cli/${{ matrix.artifact_name }}

      - name: Upload Rust host CLI artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rust-host-cli-${{ runner.os }}
          path: dist/rust-cli/${{ matrix.artifact_name }}
          if-no-files-found: error

  skill-bundle:
    name: Upload skill bundle artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v6

      - name: Package skill bundle
        run: |
          mkdir -p dist/skills
          tar -C skills -czf dist/skills/skills-radxa-linkr-debugger.tar.gz radxa-linkr-debugger

      - name: Upload skill bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: skills-radxa-linkr-debugger
          path: dist/skills/skills-radxa-linkr-debugger.tar.gz
          if-no-files-found: error
