name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  rust-cli-release:
    name: Build Rust host CLI release archives
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: radxa-linkr-debuggerctl-rust_linux_amd64.tar.gz
          - os: macos-latest
            asset_name: radxa-linkr-debuggerctl-rust_darwin_arm64.tar.gz
          - os: windows-latest
            asset_name: radxa-linkr-debuggerctl-rust_windows_amd64.zip

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout application
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: app

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/cmd-ng

      - name: Build Rust release binary
        shell: bash
        run: |
          cargo build --release --manifest-path app/cmd-ng/Cargo.toml
          expected_version="${{ steps.release.outputs.tag }}"
          expected_version="${expected_version#v}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./app/cmd-ng/target/release/radxa-linkr-debuggerctl.exe --help
            version_output="$(./app/cmd-ng/target/release/radxa-linkr-debuggerctl.exe --version)"
          else
            ./app/cmd-ng/target/release/radxa-linkr-debuggerctl --help
            version_output="$(./app/cmd-ng/target/release/radxa-linkr-debuggerctl --version)"
          fi
          test "$version_output" = "radxa-linkr-debuggerctl $expected_version"

      - name: Package Rust release archive
        if: runner.os != 'Windows'
        run: |
          mkdir -p rust-release
          tar -C app/cmd-ng/target/release -czf rust-release/${{ matrix.asset_name }} radxa-linkr-debuggerctl

      - name: Package Rust release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path rust-release | Out-Null
          Compress-Archive -Path app/cmd-ng/target/release/radxa-linkr-debuggerctl.exe -DestinationPath rust-release/${{ matrix.asset_name }}

      - name: Upload Rust release archive
        uses: actions/upload-artifact@v6
        with:
          name: rust-release-${{ runner.os }}
          path: rust-release/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    needs:
      - rust-cli-release

    steps:
      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout application
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.release.outputs.tag }}
          path: app

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Set up Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          toolchains: arm-zephyr-eabi
          sdk-version: "1.0.1"

      - name: Install MCUboot image tool dependencies
        run: python3 -m pip install -r bootloader/mcuboot/scripts/requirements.txt

      - name: Run unit tests
        working-directory: app
        run: ./apps/radxa_linkr_debugger/tests/run_unit_tests.sh

      - name: Build RP2350 firmware
        run: |
          mkdir -p release-assets
          west build -p always -b rpi_pico2/rp2350a/m33/mcuboot --sysbuild app/apps/radxa_linkr_debugger -d build/radxa_linkr_debugger
          python3 "$ZEPHYR_BASE/scripts/build/mergehex.py" \
            -o build/radxa_linkr_debugger/radxa-linkr-debugger-rp2350-combined.hex \
            build/radxa_linkr_debugger/mcuboot/zephyr/zephyr.hex \
            build/radxa_linkr_debugger/radxa_linkr_debugger/zephyr/zephyr.signed.hex
          python3 "$ZEPHYR_BASE/scripts/build/uf2conv.py" \
            -c -f 0xe48bff57 \
            -o release-assets/radxa-linkr-debugger-rp2350.uf2 \
            build/radxa_linkr_debugger/radxa-linkr-debugger-rp2350-combined.hex
          cp build/radxa_linkr_debugger/radxa_linkr_debugger/zephyr/zephyr.signed.bin release-assets/radxa-linkr-debugger-rp2350-ota.bin
          cp build/radxa_linkr_debugger/radxa_linkr_debugger/zephyr/zephyr.elf release-assets/radxa-linkr-debugger-rp2350.elf
          cp build/radxa_linkr_debugger/radxa_linkr_debugger/zephyr/zephyr.map release-assets/radxa-linkr-debugger-rp2350.map

      - name: Download Rust release archives
        uses: actions/download-artifact@v6
        with:
          pattern: rust-release-*
          path: rust-release-downloads
          merge-multiple: true

      - name: Package skill bundle
        working-directory: app
        run: |
          mkdir -p dist/skill-bundle
          tar -C skills -czf dist/skill-bundle/skills-radxa-linkr-debugger.tar.gz radxa-linkr-debugger

      - name: Prepare release assets
        working-directory: app
        run: |
          mkdir -p dist/release
          cp ../release-assets/radxa-linkr-debugger-rp2350.* dist/release/
          cp ../release-assets/radxa-linkr-debugger-rp2350-ota.bin dist/release/
          cp ../rust-release-downloads/radxa-linkr-debuggerctl-rust_* \
            dist/release/
          cp dist/skill-bundle/skills-radxa-linkr-debugger.tar.gz dist/release/
          cd dist/release
          sha256sum \
            radxa-linkr-debugger-rp2350.elf \
            radxa-linkr-debugger-rp2350.map \
            radxa-linkr-debugger-rp2350-ota.bin \
            radxa-linkr-debugger-rp2350.uf2 \
            radxa-linkr-debuggerctl-rust_* \
            skills-radxa-linkr-debugger.tar.gz > SHA256SUMS.txt

      - name: Write release notes
        working-directory: app
        run: |
          cat > dist/release-notes.md <<EOF
          Radxa Linkr Debugger ${{ steps.release.outputs.tag }}

          Included assets:
          - RP2350 firmware: combined initial/recovery UF2, OTA BIN, ELF, and MAP
          - Primary Rust host CLI/TUI archives: radxa-linkr-debuggerctl-rust_{os}_{arch}
          - Agent skill bundle: skills-radxa-linkr-debugger.tar.gz
          - SHA256SUMS.txt for release asset verification
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        working-directory: app
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name | select(test("^radxa-linkr-debuggerctl_(linux|darwin|windows)_(amd64|arm64)\\.(tar\\.gz|zip)$"))' |
              while IFS= read -r legacy_asset; do
                gh release delete-asset "$RELEASE_TAG" "$legacy_asset" \
                  --repo "$GITHUB_REPOSITORY" \
                  --yes
              done
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file dist/release-notes.md
            gh release upload "$RELEASE_TAG" dist/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" dist/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file dist/release-notes.md
          fi
