name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release"
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve immutable release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      normalized_tag: ${{ steps.resolve.outputs.normalized_tag }}
      resolved_sha: ${{ steps.resolve.outputs.resolved_sha }}
    steps:
      - name: Checkout release refs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve release tag to commit
        id: resolve
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            [[ "$GITHUB_REF_TYPE" == "tag" ]]
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$REQUESTED_TAG"
          else
            exit 1
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          tag_ref="refs/tags/$tag"
          git show-ref --verify --quiet "$tag_ref"
          resolved_sha="$(git rev-parse --verify "${tag_ref}^{commit}")"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            event_sha="$(git rev-parse --verify "${GITHUB_SHA}^{commit}")"
            [[ "$resolved_sha" == "$event_sha" ]]
          fi
          printf 'normalized_tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'resolved_sha=%s\n' "$resolved_sha" >> "$GITHUB_OUTPUT"

  validation:
    name: Run the complete repository validation workflow
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      source_sha: ${{ needs.resolve.outputs.resolved_sha }}

  version-gate:
    name: Check synchronized project version and tag
    needs: resolve
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve.outputs.resolved_sha }}
          path: app
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Check synchronized versions and release tag
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.normalized_tag }}
        run: python3 app/scripts/version_sync.py check --tag "$RELEASE_TAG"

  rust-cli-release:
    name: Build Rust host CLI release archives
    needs:
      - resolve
      - validation
      - version-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_id: Linux-amd64
            asset_name: radxa-linkr-debuggerctl-rust_linux_amd64.tar.gz
            binary_path: app/cmd-ng/target/x86_64-unknown-linux-musl/release/radxa-linkr-debuggerctl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact_id: Linux-arm64
            asset_name: radxa-linkr-debuggerctl-rust_linux_arm64.tar.gz
            binary_path: app/cmd-ng/target/aarch64-unknown-linux-musl/release/radxa-linkr-debuggerctl
          - os: macos-latest
            target: ""
            artifact_id: macOS-arm64
            asset_name: radxa-linkr-debuggerctl-rust_darwin_arm64.tar.gz
            binary_path: app/cmd-ng/target/release/radxa-linkr-debuggerctl
          - os: windows-latest
            target: ""
            artifact_id: Windows-amd64
            asset_name: radxa-linkr-debuggerctl-rust_windows_amd64.zip
            binary_path: app/cmd-ng/target/release/radxa-linkr-debuggerctl.exe

    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve.outputs.resolved_sha }}
          path: app
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Set up Python for Linux cross compilation
        if: runner.os == 'Linux'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/cmd-ng

      - name: Install Linux cross-compile tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
          rustup target add "${{ matrix.target }}"
          python3 -m pip install cargo-zigbuild==0.23.0 ziglang==0.16.0

      - name: Install ARM64 emulator
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Build Rust release binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cargo zigbuild --locked --release --manifest-path app/cmd-ng/Cargo.toml --target "${{ matrix.target }}"
            file "${{ matrix.binary_path }}"
            if readelf -l "${{ matrix.binary_path }}" | grep -q "Requesting program interpreter"; then
              echo "Linux release binary must not use a dynamic interpreter" >&2
              exit 1
            fi
            if readelf -d "${{ matrix.binary_path }}" | grep -q '(NEEDED)'; then
              echo "Linux release binary must not have dynamic library dependencies" >&2
              exit 1
            fi
            if strings "${{ matrix.binary_path }}" | grep -Eq 'GLIBC_[0-9]'; then
              echo "Linux release binary must not require glibc symbols" >&2
              exit 1
            fi
          else
            cargo build --locked --release --manifest-path app/cmd-ng/Cargo.toml
          fi
          expected_version="${{ needs.resolve.outputs.normalized_tag }}"
          expected_version="${expected_version#v}"
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            qemu-aarch64-static "${{ matrix.binary_path }}" --help
            version_output="$(qemu-aarch64-static "${{ matrix.binary_path }}" --version)"
          else
            "${{ matrix.binary_path }}" --help
            version_output="$("${{ matrix.binary_path }}" --version)"
          fi
          test "$version_output" = "radxa-linkr-debuggerctl $expected_version"

      - name: Package Rust release archive
        if: runner.os != 'Windows'
        run: |
          stage_dir=rust-release/stage
          mkdir -p "$stage_dir"
          cp "${{ matrix.binary_path }}" "$stage_dir/radxa-linkr-debuggerctl"
          ln -s radxa-linkr-debuggerctl "$stage_dir/rdb"
          test "$(readlink "$stage_dir/rdb")" = radxa-linkr-debuggerctl
          tar -C "$stage_dir" \
            -czf rust-release/${{ matrix.asset_name }} \
            radxa-linkr-debuggerctl rdb

      - name: Package Rust release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stageDir = "rust-release/stage"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item -Path "${{ matrix.binary_path }}" -Destination (Join-Path $stageDir "radxa-linkr-debuggerctl.exe")
          New-Item -ItemType HardLink -Path (Join-Path $stageDir "rdb.exe") -Target (Join-Path $stageDir "radxa-linkr-debuggerctl.exe") | Out-Null
          $primaryHash = (Get-FileHash -Algorithm SHA256 (Join-Path $stageDir "radxa-linkr-debuggerctl.exe")).Hash
          $aliasHash = (Get-FileHash -Algorithm SHA256 (Join-Path $stageDir "rdb.exe")).Hash
          if ($primaryHash -ne $aliasHash) { throw "rdb.exe must match radxa-linkr-debuggerctl.exe" }
          Compress-Archive -Path (Join-Path $stageDir "radxa-linkr-debuggerctl.exe"), (Join-Path $stageDir "rdb.exe") -DestinationPath rust-release/${{ matrix.asset_name }}

      - name: Upload Rust release archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: rust-release-${{ matrix.artifact_id }}
          path: rust-release/${{ matrix.asset_name }}
          if-no-files-found: error

  host-desktop-release:
    name: Build unified desktop Host archives
    needs:
      - resolve
      - validation
      - version-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_id: Linux-amd64
            asset_name: radxa-linkr-desktop_linux_amd64.tar.gz
          - os: macos-latest
            artifact_id: macOS-arm64
            asset_name: radxa-linkr-desktop_darwin_arm64.tar.gz
          - os: windows-latest
            artifact_id: Windows-amd64
            asset_name: radxa-linkr-desktop_windows_amd64.zip

    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve.outputs.resolved_sha }}
          path: app
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            app/host-tools
            app/cmd-ng

      - name: Build Web, Host, tray and CLI
        shell: bash
        run: |
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          npm --prefix app/web ci
          npm --prefix app/web run build
          cargo build --locked --release --manifest-path app/host-tools/Cargo.toml
          cargo build --locked --release --manifest-path app/cmd-ng/Cargo.toml
          "app/host-tools/target/release/linkr-host$suffix" --version
          "app/host-tools/target/release/linkr-tray$suffix" --version
          "app/cmd-ng/target/release/radxa-linkr-debuggerctl$suffix" --version

      - name: Assemble desktop bundle
        shell: bash
        run: |
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          root="desktop-release/radxa-linkr-desktop"
          mkdir -p "$root/bin" "$root/share/radxa-linkr-debugger/web"
          cp "app/host-tools/target/release/linkr-host$suffix" "$root/bin/"
          cp "app/host-tools/target/release/linkr-tray$suffix" "$root/bin/"
          cp "app/cmd-ng/target/release/radxa-linkr-debuggerctl$suffix" "$root/bin/"
          cp -R app/web/dist/. "$root/share/radxa-linkr-debugger/web/"
          cp app/scripts/install-host.sh "$root/install.sh"
          cp app/scripts/install-host.ps1 "$root/install.ps1"

      - name: Package desktop archive
        if: runner.os != 'Windows'
        run: tar -C desktop-release -czf desktop-release/${{ matrix.asset_name }} radxa-linkr-desktop

      - name: Package desktop archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path desktop-release\radxa-linkr-desktop -DestinationPath desktop-release\${{ matrix.asset_name }}

      - name: Upload desktop archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: desktop-release-${{ matrix.artifact_id }}
          path: desktop-release/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - resolve
      - version-gate
      - rust-cli-release
      - host-desktop-release

    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.resolved_sha }}
          path: app
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Set up Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a # v1
        with:
          app-path: app
          toolchains: arm-zephyr-eabi
          sdk-version: "1.0.1"

      - name: Install MCUboot image tool dependencies
        run: python3 -m pip install -r bootloader/mcuboot/scripts/requirements.txt

      - name: Run unit tests
        working-directory: app
        run: ./apps/radxa_linkr_debugger/tests/run_unit_tests.sh

      - name: Build RP2350 firmware
        run: |
          mkdir -p release-assets
          west build -p always -b rpi_pico2/rp2350a/m33/mcuboot --sysbuild app/apps/radxa_linkr_debugger -d build/radxa_linkr_debugger
          cp build/radxa_linkr_debugger/radxa-linkr-debugger-rp2350.uf2 release-assets/radxa-linkr-debugger-rp2350.uf2
          cp build/radxa_linkr_debugger/radxa_linkr_debugger/zephyr/zephyr.signed.bin release-assets/radxa-linkr-debugger-rp2350-ota.bin
          cp build/radxa_linkr_debugger/radxa_linkr_debugger/zephyr/zephyr.elf release-assets/radxa-linkr-debugger-rp2350.elf
          cp build/radxa_linkr_debugger/radxa_linkr_debugger/zephyr/zephyr.map release-assets/radxa-linkr-debugger-rp2350.map

      - name: Download Rust release archives
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: rust-release-*
          path: rust-release-downloads
          merge-multiple: true

      - name: Download desktop release archives
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: desktop-release-*
          path: desktop-release-downloads
          merge-multiple: true

      - name: Package skill bundle
        working-directory: app
        run: |
          mkdir -p dist/skill-bundle
          tar -C skills -czf dist/skill-bundle/skills-radxa-linkr-debugger.tar.gz radxa-linkr-debugger

      - name: Prepare release assets
        working-directory: app
        run: |
          mkdir -p dist/release
          cp ../release-assets/radxa-linkr-debugger-rp2350.* dist/release/
          cp ../release-assets/radxa-linkr-debugger-rp2350-ota.bin dist/release/
          cp ../rust-release-downloads/radxa-linkr-debuggerctl-rust_* \
            dist/release/
          cp ../desktop-release-downloads/radxa-linkr-desktop_* \
            dist/release/
          cp dist/skill-bundle/skills-radxa-linkr-debugger.tar.gz dist/release/
          cd dist/release
          sha256sum \
            radxa-linkr-debugger-rp2350.elf \
            radxa-linkr-debugger-rp2350.map \
            radxa-linkr-debugger-rp2350-ota.bin \
            radxa-linkr-debugger-rp2350.uf2 \
            radxa-linkr-desktop_* \
            radxa-linkr-debuggerctl-rust_* \
            skills-radxa-linkr-debugger.tar.gz > SHA256SUMS.txt

      - name: Write release notes
        working-directory: app
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.normalized_tag }}
        run: |
          release_notes="docs/releases/${RELEASE_TAG%%-*}.md"
          if [ ! -f "$release_notes" ]; then
            echo "Missing curated release notes: $release_notes" >&2
            exit 1
          fi
          cp "$release_notes" dist/release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.normalized_tag }}
          RESOLVED_SHA: ${{ needs.resolve.outputs.resolved_sha }}
        working-directory: app
        run: |
          set -euo pipefail
          object_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          object_type="$(jq -r '.object.type' <<<"$object_json")"
          object_sha="$(jq -r '.object.sha' <<<"$object_json")"
          while [[ "$object_type" == "tag" ]]; do
            object_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
            object_type="$(jq -r '.object.type' <<<"$object_json")"
            object_sha="$(jq -r '.object.sha' <<<"$object_json")"
          done
          [[ "$object_type" == "commit" ]]
          [[ "$object_sha" == "$RESOLVED_SHA" ]]
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name | select(test("^radxa-linkr-debuggerctl_(linux|darwin|windows)_(amd64|arm64)\\.(tar\\.gz|zip)$"))' |
              while IFS= read -r legacy_asset; do
                gh release delete-asset "$RELEASE_TAG" "$legacy_asset" \
                  --repo "$GITHUB_REPOSITORY" \
                  --yes
              done
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file dist/release-notes.md \
              "${release_flags[@]}"
            gh release upload "$RELEASE_TAG" dist/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" dist/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file dist/release-notes.md \
              "${release_flags[@]}"
          fi
