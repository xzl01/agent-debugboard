[package]
name = "agent-debugboardctl-ng"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "agent-debugboardctl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
crossterm = "0.29.0"
humantime = "2.3.0"
ratatui = "0.29.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
